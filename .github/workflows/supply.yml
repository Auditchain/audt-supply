# Alternative hosting: GitHub Actions rebuilds static JSON every 30 minutes and publishes it with GitHub Pages.
# Copy this file to .github/workflows/supply.yml in a repository that contains build/supply-api/, enable Pages (source: GitHub Actions),
# and the endpoints become https://<org>.github.io/<repo>/total.json and /circulating.json (or a custom domain via CNAME).
name: AUDT supply
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node local-run.mjs --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
